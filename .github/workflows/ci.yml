name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: ci (elixir ${{ matrix.elixir }} / otp ${{ matrix.otp }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pinned pair — matches mise.toml's default tool versions.
          - elixir: "1.19.5-otp-28"
            otp: "28.4.2"
            run_gitleaks: true
          # Older pair covering mix.exs's `elixir: "~> 1.18"` claim.
          - elixir: "1.18.5-otp-27"
            otp: "27.3.4.17"
            run_gitleaks: false
    env:
      MISE_ELIXIR_VERSION: ${{ matrix.elixir }}
      MISE_ERLANG_VERSION: ${{ matrix.otp }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup mise
        uses: jdx/mise-action@v4

      - name: Cache deps and _build
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('mix.lock', 'mise.toml') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ matrix.elixir }}-${{ matrix.otp }}-

      - name: Fetch deps
        run: mise run deps

      - name: Format, compile, lint, test
        run: mise exec -- mix ci

      - name: Hex audit
        run: mise run hex-audit

      # Gitleaks scans repository history, which is identical across legs —
      # run it once, on the pinned leg, rather than duplicating the scan.
      - name: Gitleaks
        if: matrix.run_gitleaks
        run: mise run gitleaks
