name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: ci (elixir ${{ matrix.elixir }} / otp ${{ matrix.otp }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pinned pair — matches mise.toml's default tool versions.
          - elixir: "1.19.5-otp-28"
            otp: "28.4.2"
            pinned: true
          # Older pair covering mix.exs's `elixir: "~> 1.18"` claim.
          - elixir: "1.18.5-otp-27"
            otp: "27.3.4.17"
            pinned: false
    env:
      MISE_ELIXIR_VERSION: ${{ matrix.elixir }}
      MISE_ERLANG_VERSION: ${{ matrix.otp }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # mise-action's own tool cache uses one key shared across every matrix
      # leg (not scoped by MISE_ELIXIR_VERSION/MISE_ERLANG_VERSION), which
      # races when legs run in parallel. Disable it; the deps/_build cache
      # below is scoped per leg and is the one that matters for CI time.
      - name: Setup mise
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          cache: false

      - name: Cache deps and _build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('mix.lock', 'mise.toml') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ matrix.elixir }}-${{ matrix.otp }}-

      # The pinned leg runs the same `mise run ci` DAG as a local run: deps,
      # the hex/deps/advisory-doc audits, the audit script tests, `mix ci`
      # and gitleaks. Audits read mix.lock and the advisory databases, not
      # OTP or Elixir, and gitleaks scans history that is identical across
      # legs, so they run once, here.
      - name: Full CI (audits, tests, gitleaks)
        if: matrix.pinned
        run: mise run ci

      # `mise run <task>` resolves tool versions straight from mise.toml's
      # [tools] table and ignores MISE_ELIXIR_VERSION/MISE_ERLANG_VERSION —
      # confirmed by a CI run where `mise run deps` tried to install the
      # OTHER leg's pinned pair mid-job despite the override being active
      # (and correctly honored moments earlier by `mise install` in the
      # Setup mise step). `mise exec --` does respect the override, so the
      # compat leg calls the underlying commands through it. The pinned leg
      # can use `mise run` because its pair equals mise.toml.
      - name: Fetch deps
        if: ${{ !matrix.pinned }}
        run: mise exec -- mix deps.get --check-locked

      - name: Format, compile, lint, test
        if: ${{ !matrix.pinned }}
        run: mise exec -- mix ci
