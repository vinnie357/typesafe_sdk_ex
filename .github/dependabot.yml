# Dependabot does not track the mise.toml erlang/elixir pins or the CI matrix; audit:otp and test/test-audit-wiring.nu guard those.
version: 2
updates:
  - package-ecosystem: "mix"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
